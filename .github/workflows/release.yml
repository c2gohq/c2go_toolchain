name: Release C2Go toolchain

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: CalVer version used for an unsigned dry-run package build
        required: true
        default: v0.20260729.0-rc.1
        type: string

permissions:
  contents: read

concurrency:
  group: c2go-toolchain-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release inputs
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
    steps:
      - name: Check out the pinned toolchain
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Resolve release context
        id: release
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${DISPATCH_VERSION}"
          fi
          python3 scripts/release_version.py "${version}"
          prerelease=false
          if [[ "${version}" == *-rc.* ]]; then
            prerelease=true
          fi
          printf 'version=%s\n' "${version}" >>"${GITHUB_OUTPUT}"
          printf 'prerelease=%s\n' "${prerelease}" >>"${GITHUB_OUTPUT}"
          printf 'source_date_epoch=%s\n' "$(git show -s --format=%ct HEAD)" >>"${GITHUB_OUTPUT}"

      - name: Validate the pinned snapshot
        if: github.ref_type != 'tag'
        run: python3 scripts/verify-release.py --snapshot

      - name: Validate immutable release metadata and remote tags
        if: github.ref_type == 'tag'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          locked_version="$(python3 -c 'import json; print(json.load(open("toolchain.lock.json"))["release"]["version"])')"
          if [[ "${locked_version}" != "${VERSION}" ]]; then
            printf 'toolchain tag %s does not match lock version %s\n' "${VERSION}" "${locked_version}" >&2
            exit 1
          fi
          if [[ ! -f "RELEASE_NOTES/${VERSION}.md" ]]; then
            printf 'release notes are missing: RELEASE_NOTES/%s.md\n' "${VERSION}" >&2
            exit 1
          fi
          python3 scripts/verify-release.py

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: windows-amd64
            runner: windows-2022
          - target: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Check out the pinned toolchain
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: 1.25.9
          cache: false

      - name: Show builder versions
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          go version
          python3 --version
          if [[ "${RUNNER_OS}" != "Windows" ]]; then
            ninja --version
          fi

      - name: Configure C2Go Clang on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            -S components/c2go-clang/llvm
            -B build/c2go-clang
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DLLVM_ENABLE_PROJECTS=clang
            "-DLLVM_TARGETS_TO_BUILD=X86;AArch64"
            -DLLVM_ENABLE_ASSERTIONS=OFF
            -DLLVM_INCLUDE_TESTS=OFF
            -DCLANG_INCLUDE_TESTS=OFF
            -DLLVM_INCLUDE_EXAMPLES=OFF
            -DLLVM_INCLUDE_BENCHMARKS=OFF
            -DLLVM_INCLUDE_DOCS=OFF
            -DLLVM_ENABLE_BINDINGS=OFF
            -DLLVM_ENABLE_LIBXML2=OFF
            -DLLVM_ENABLE_ZLIB=OFF
            -DLLVM_ENABLE_ZSTD=OFF
            -DLLVM_ENABLE_CURL=OFF
            -DLLVM_ENABLE_HTTPLIB=OFF
            -DCLANG_ENABLE_OBJC_REWRITER=OFF
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF
            -DLLVM_PARALLEL_LINK_JOBS=1
          )
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            args+=( -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 )
          fi
          cmake "${args[@]}"

      - name: Build C2Go Clang on Linux or macOS
        if: runner.os != 'Windows'
        run: cmake --build build/c2go-clang --target c2go-toolchain --parallel 4

      - name: Configure C2Go Clang on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S components/c2go-clang/llvm -B build/c2go-clang `
            -G "Visual Studio 17 2022" -A x64 -Thost=x64 `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DLLVM_ENABLE_PROJECTS=clang `
            "-DLLVM_TARGETS_TO_BUILD=X86;AArch64" `
            -DLLVM_ENABLE_ASSERTIONS=OFF `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DCLANG_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            -DLLVM_INCLUDE_DOCS=OFF `
            -DLLVM_ENABLE_BINDINGS=OFF `
            -DLLVM_ENABLE_LIBXML2=OFF `
            -DLLVM_ENABLE_ZLIB=OFF `
            -DLLVM_ENABLE_ZSTD=OFF `
            -DLLVM_ENABLE_CURL=OFF `
            -DLLVM_ENABLE_HTTPLIB=OFF `
            -DLLVM_ENABLE_DIA_SDK=OFF `
            -DCLANG_ENABLE_OBJC_REWRITER=OFF `
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF

      - name: Build C2Go Clang on Windows
        if: runner.os == 'Windows'
        run: cmake --build build/c2go-clang --config Release --target c2go-toolchain --parallel 4

      - name: Test and build c2go-bind on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build
          cd components/c2go-bind
          go test ./...
          go build -trimpath -ldflags="-s -w -X=main.version=${VERSION}" \
            -o "${GITHUB_WORKSPACE}/build/c2go-bind" .
          test "$("${GITHUB_WORKSPACE}/build/c2go-bind" --version)" = "c2go-bind ${VERSION}"

      - name: Test and build c2go-bind on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Push-Location components/c2go-bind
          go test ./...
          go build -trimpath "-ldflags=-s -w -X=main.version=$env:VERSION" `
            -o "$env:GITHUB_WORKSPACE/build/c2go-bind.exe" .
          Pop-Location
          $actual = & "$env:GITHUB_WORKSPACE/build/c2go-bind.exe" --version
          if ($actual -ne "c2go-bind $env:VERSION") {
            throw "unexpected c2go-bind version: $actual"
          }

      - name: Test the matched c2go-libc runtime
        shell: bash
        run: go test ./...
        working-directory: components/c2go-libc

      - name: Package Linux or macOS toolchain
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          python3 scripts/package-toolchain.py \
            --version "${VERSION}" \
            --target "${{ matrix.target }}" \
            --clang-build-dir build/c2go-clang \
            --c2go-bind build/c2go-bind \
            --output-dir dist

      - name: Package Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          python3 scripts/package-toolchain.py `
            --version "$env:VERSION" `
            --target "${{ matrix.target }}" `
            --clang-build-dir build/c2go-clang `
            --c2go-bind build/c2go-bind.exe `
            --output-dir dist

      - name: Verify installed SDK archive end to end
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          suffix=.tar.gz
          if [[ "${TARGET}" == windows-* ]]; then
            suffix=.zip
          fi
          python3 scripts/verify-package.py \
            --version "${VERSION}" \
            --target "${TARGET}" \
            --archive "dist/c2go-toolchain-${VERSION}-${TARGET}${suffix}" \
            --libc-source components/c2go-libc

      - name: Upload target archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: c2go-toolchain-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  source:
    name: Build complete source bundle
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out the pinned toolchain
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Revalidate recursive source snapshot
        run: python3 scripts/verify-release.py --snapshot

      - name: Package complete corresponding source
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          python3 scripts/package-source.py \
            --version "${VERSION}" \
            --output-dir dist

      - name: Upload source archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: c2go-toolchain-source
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble release assets
    needs:
      - prepare
      - build
      - source
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download target archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: c2go-toolchain-*
          path: dist
          merge-multiple: true

      - name: Verify and combine checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for checksum in *.sha256; do
            tr -d '\r' <"${checksum}" >"${checksum}.lf"
            mv -- "${checksum}.lf" "${checksum}"
            sha256sum --check "${checksum}"
          done
          cat -- *.sha256 | LC_ALL=C sort -k2 >SHA256SUMS

      - name: Upload complete unsigned release bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: c2go-toolchain-${{ needs.prepare.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or resume GitHub Release draft
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${VERSION}" --json isDraft --jq .isDraft)"
            if [[ "${is_draft}" != "true" ]]; then
              printf 'release %s is already published; refusing to replace assets\n' "${VERSION}" >&2
              exit 1
            fi
            printf 'resuming existing draft release %s\n' "${VERSION}"
          else
            args=(
              release create "${VERSION}"
              --verify-tag
              --draft
              --title "${VERSION}"
              --notes-file "RELEASE_NOTES/${VERSION}.md"
            )
            if [[ "${PRERELEASE}" == "true" ]]; then
              args+=( --prerelease )
            fi
            if ! gh "${args[@]}"; then
              # `gh release create` and asset uploads are separate API calls. If
              # the create response was lost, accept only the draft it created.
              sleep 5
              is_draft="$(gh release view "${VERSION}" --json isDraft --jq .isDraft 2>/dev/null || true)"
              if [[ "${is_draft}" != "true" ]]; then
                exit 1
              fi
            fi
          fi

          # A newly-created draft can briefly return 404 from uploads.github.com.
          # Upload one asset at a time with bounded backoff. On a lost success
          # response, accept an existing asset only when its byte size matches;
          # never delete or overwrite an asset automatically.
          sleep 5
          for asset in dist/*; do
            name="$(basename "${asset}")"
            local_size="$(stat -c %s -- "${asset}")"
            uploaded=false
            for attempt in 1 2 3 4 5 6; do
              remote_size="$(
                gh release view "${VERSION}" --json assets \
                  --jq ".assets[] | select(.name == \"${name}\") | .size" \
                  2>/dev/null | head -n1 || true
              )"
              if [[ -n "${remote_size}" ]]; then
                if [[ "${remote_size}" != "${local_size}" ]]; then
                  printf 'draft asset %s has size %s, expected %s; refusing to overwrite\n' \
                    "${name}" "${remote_size}" "${local_size}" >&2
                  exit 1
                fi
                uploaded=true
                break
              fi
              if gh release upload "${VERSION}" "${asset}"; then
                uploaded=true
                break
              fi
              if [[ "${attempt}" -lt 6 ]]; then
                sleep "$((attempt * 5))"
              fi
            done
            if [[ "${uploaded}" != "true" ]]; then
              printf 'failed to upload release asset after retries: %s\n' "${name}" >&2
              exit 1
            fi
          done
